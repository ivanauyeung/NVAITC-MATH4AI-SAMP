version: '3.8'
services:
  container-1:
    image: pytorch/pytorch:2.10.0-cuda12.8-cudnn9-devel
    ports:
      - '8888:8888'
    volumes:
      - ../NVAITC-MATH4AI-SAMP:/NVAITC-MATH4AI-SAMP
    entrypoint: /bin/bash
    command: >-
       -c "export PATH="$HOME/.local/bin:$PATH" &&
       pip install --break-system-packages jupyterlab &&
       jupyter lab --ip=0.0.0.0 --no-browser --NotebookApp.token=''
       --allow-root --NotebookApp.allow_origin='*' --NotebookApp.password=''
       --notebook-dir='/NVAITC-MATH4AI-SAMP'"
